<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">MeshAlot network logo</title><desc id="desc">Orange MeshAlot wordmark over a glowing teal mesh network on a dark binary background.</desc>
<defs>
<radialGradient id="bgGlow" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#001a12"/><stop offset=".6" stop-color="#000805"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00ffb3"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
<radialGradient id="nodeGlow"><stop offset="0" stop-color="#e6fff7"/><stop offset=".4" stop-color="#00ffc8"/><stop offset="1" stop-color="#00ffc8" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="textGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="binary" width="96" height="64" patternUnits="userSpaceOnUse"><text x="12" y="20" fill="#00ff99" opacity=".08" font-family="Consolas,Courier New,monospace" font-size="13">1</text><text x="62" y="50" fill="#00ff99" opacity=".06" font-family="Consolas,Courier New,monospace" font-size="13">0</text></pattern>
</defs>
<rect width="800" height="800" fill="url(#bgGlow)"/><rect width="800" height="800" fill="url(#binary)"/>
<g><circle cx="400" cy="160" r="26" fill="url(#nodeGlow)"/><circle cx="570" cy="230" r="26" fill="url(#nodeGlow)"/><circle cx="640" cy="400" r="26" fill="url(#nodeGlow)"/><circle cx="570" cy="570" r="26" fill="url(#nodeGlow)"/><circle cx="400" cy="640" r="26" fill="url(#nodeGlow)"/><circle cx="230" cy="570" r="26" fill="url(#nodeGlow)"/><circle cx="160" cy="400" r="26" fill="url(#nodeGlow)"/><circle cx="230" cy="230" r="26" fill="url(#nodeGlow)"/><circle cx="400" cy="400" r="34" fill="url(#nodeGlow)"/></g>
<g fill="#eafff9" filter="url(#glow)"><circle cx="400" cy="160" r="8"/><circle cx="570" cy="230" r="8"/><circle cx="640" cy="400" r="8"/><circle cx="570" cy="570" r="8"/><circle cx="400" cy="640" r="8"/><circle cx="230" cy="570" r="8"/><circle cx="160" cy="400" r="8"/><circle cx="230" cy="230" r="8"/><circle cx="400" cy="400" r="12"/></g>
<text x="400" y="430" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="120" font-weight="700" letter-spacing="2" fill="#ff6a00" filter="url(#textGlow)">MeshAlot</text>
<g stroke="url(#lineGrad)" stroke-width="1.6" opacity=".55" filter="url(#glow)"><line x1="400" y1="160" x2="570" y2="230"/><line x1="400" y1="160" x2="640" y2="400"/><line x1="400" y1="160" x2="570" y2="570"/><line x1="400" y1="160" x2="400" y2="640"/><line x1="400" y1="160" x2="230" y2="570"/><line x1="400" y1="160" x2="160" y2="400"/><line x1="400" y1="160" x2="230" y2="230"/><line x1="400" y1="160" x2="400" y2="400"/><line x1="570" y1="230" x2="640" y2="400"/><line x1="570" y1="230" x2="570" y2="570"/><line x1="570" y1="230" x2="400" y2="640"/><line x1="570" y1="230" x2="230" y2="570"/><line x1="570" y1="230" x2="160" y2="400"/><line x1="570" y1="230" x2="230" y2="230"/><line x1="570" y1="230" x2="400" y2="400"/><line x1="640" y1="400" x2="570" y2="570"/><line x1="640" y1="400" x2="400" y2="640"/><line x1="640" y1="400" x2="230" y2="570"/><line x1="640" y1="400" x2="160" y2="400"/><line x1="640" y1="400" x2="230" y2="230"/><line x1="640" y1="400" x2="400" y2="400"/><line x1="570" y1="570" x2="400" y2="640"/><line x1="570" y1="570" x2="230" y2="570"/><line x1="570" y1="570" x2="160" y2="400"/><line x1="570" y1="570" x2="230" y2="230"/><line x1="570" y1="570" x2="400" y2="400"/><line x1="400" y1="640" x2="230" y2="570"/><line x1="400" y1="640" x2="160" y2="400"/><line x1="400" y1="640" x2="230" y2="230"/><line x1="400" y1="640" x2="400" y2="400"/><line x1="230" y1="570" x2="160" y2="400"/><line x1="230" y1="570" x2="230" y2="230"/><line x1="230" y1="570" x2="400" y2="400"/><line x1="160" y1="400" x2="230" y2="230"/><line x1="160" y1="400" x2="400" y2="400"/><line x1="230" y1="230" x2="400" y2="400"/></g>
</svg>