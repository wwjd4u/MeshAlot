name: MS-02 M13 Gate 17 External Backup Disk Read-only Inventory
on:
  push:
    branches: [infra/ms02-runner-gateway]
    paths: [.github/workflows/ms02-m13-gate17-external-disk-inventory-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'wwjd4u/MeshAlot' && github.ref == 'refs/heads/infra/ms02-runner-gateway'
    runs-on: [self-hosted, Linux, X64, meshalot, ms02]
    timeout-minutes: 4
    steps:
      - name: Identify 2TB USB disk partition filesystem types without mounting
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "meshalot-ms02"
          test "$(hostname -s)" = "wwjd4u-MS-02-Ultra"
          test "$(id -un)" = "jason_guynes"
          test "$HOME" = "/home/jason_guynes"
          python3 - <<'PY'
          import json, os, subprocess, sys

          def die():
              print("M13_EXTERNAL_DISK_INVENTORY=FAILED_SAFE_STOP")
              sys.exit(1)

          def flatten(d):
              yield d
              for child in d.get("children", []):
                  yield from flatten(child)

          def gib(value):
              return int(value or 0) // (1024**3)

          def print_volumes(prefix, disk):
              known_fs = {"ext4", "xfs", "btrfs", "exfat", "vfat", "ntfs", "ntfs3", "f2fs", "bitlocker", "crypto_luks", "apfs", "hfsplus", "lvm2_member", "zfs_member", "linux_raid_member", "udf", "iso9660", "swap"}
              mounted = []
              partition_number = 0
              for item in flatten(disk):
                  if item.get("type") == "part":
                      partition_number += 1
                      part_fs = str(item.get("fstype") or "unknown").lower()
                      print(f"{prefix}_PARTITION_{partition_number}_SIZE_GIB=" + str(gib(item.get("size"))))
                      print(f"{prefix}_PARTITION_{partition_number}_FSTYPE=" + (part_fs if part_fs in known_fs else "UNKNOWN_OR_OTHER"))
                  if item.get("fstype") and item.get("type") != "disk":
                      fs = str(item["fstype"]).lower()
                      print(prefix + "_VOLUME_FSTYPE=" + (fs if fs in known_fs else "OTHER"))
                  for mp in item.get("mountpoints") or []:
                      if mp and mp != "/":
                          mounted.append((item, mp))
              print(prefix + "_PARTITION_COUNT=" + str(partition_number))
              print(prefix + "_MOUNTED_VOLUME_COUNT=" + str(len(mounted)))
              for i, (item, mp) in enumerate(mounted, 1):
                  fs = (item.get("fstype") or "unknown").lower()
                  print(f"{prefix}_MOUNT_{i}_FSTYPE=" + (fs if fs in known_fs else "OTHER"))
                  try:
                      info = os.statvfs(mp)
                      print(f"{prefix}_MOUNT_{i}_FREE_GIB=" + str((info.f_bavail * info.f_frsize)//(1024**3)))
                  except OSError:
                      print(f"{prefix}_MOUNT_{i}_FREE_GIB=UNKNOWN")
                  try:
                      options = subprocess.check_output(
                          ["findmnt", "-n", "-o", "OPTIONS", "--target", mp],
                          text=True, timeout=5
                      ).strip().split(",")
                      print(f"{prefix}_MOUNT_{i}_READONLY=" +
                            ("YES" if "ro" in options else "NO" if "rw" in options else "UNKNOWN"))
                  except Exception:
                      print(f"{prefix}_MOUNT_{i}_READONLY=UNKNOWN")

          try:
              raw = subprocess.check_output(
                  ["lsblk", "-J", "-b", "-o",
                   "NAME,TYPE,TRAN,SIZE,FSTYPE,MOUNTPOINTS,RO,RM,HOTPLUG"],
                  text=True, timeout=15
              )
              disks = [d for d in json.loads(raw)["blockdevices"] if d.get("type") == "disk"]
              usb = [d for d in disks if d.get("tran") == "usb"]
              other = [d for d in disks if d.get("tran") != "usb"]
              print("M13_USB_DISK_COUNT=" + str(len(usb)))
              for i, disk in enumerate(usb, 1):
                  prefix = f"M13_USB_DISK_{i}"
                  print(prefix + "_SIZE_GIB=" + str(gib(disk.get("size"))))
                  print(prefix + "_HW_READONLY=" + ("YES" if disk.get("ro") else "NO"))
                  print_volumes(prefix, disk)

              # Capacity-only summary of other disk transports. Never print labels,
              # serials, device paths, mount paths, file names, or volume contents.
              print("M13_NONUSB_DISK_COUNT=" + str(len(other)))
              for i, disk in enumerate(other, 1):
                  print(f"M13_NONUSB_DISK_{i}_SIZE_GIB=" + str(gib(disk.get("size"))))
                  print(f"M13_NONUSB_DISK_{i}_TRANSPORT=" + (
                      disk.get("tran") if disk.get("tran") in ("sata", "nvme", "usb", "scsi") else "OTHER"
                  ))

              candidates = [d for d in usb if
                            1_750_000_000_000 <= int(d.get("size") or 0) <= 2_250_000_000_000]
              print("M13_USB_2TB_CANDIDATES=" + str(len(candidates)))
              print("M13_EXTERNAL_2TB_DRIVE=" + (
                  "DETECTED" if len(candidates) == 1 else "NOT_UNIQUELY_IDENTIFIED"))
              print("M13_EXTERNAL_DISK_INVENTORY=PASS_READONLY")
          except Exception:
              die()
          PY
