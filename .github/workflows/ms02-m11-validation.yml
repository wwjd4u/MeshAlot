name: MS-02 M11 Final Validation

on:
  push:
    branches:
      - infra/ms02-runner-gateway
    paths:
      - .github/workflows/ms02-m11-validation.yml

permissions:
  contents: read

jobs:
  validate-m11:
    name: M11 validation on meshalot-ms02
    runs-on:
      - self-hosted
      - Linux
      - X64
      - meshalot
      - ms02
    timeout-minutes: 15

    steps:
      - name: Check out M11 branch
        uses: actions/checkout@v4
        with:
          ref: m11-provider-controls
          fetch-depth: 0

      - name: Set up repository Go 1.24 toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify MS-02 and Go version
        shell: bash
        run: |
          echo "===== M11 FINAL VALIDATION HOST ====="
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(whoami)"
          go version
          test "$(go env GOVERSION | cut -d. -f1,2)" = "go1.24"

      - name: Verify M11 branch scope
        shell: bash
        run: |
          echo "===== M11 BRANCH SCOPE ====="
          git fetch origin main
          git diff --check origin/main...HEAD
          git diff --name-only origin/main...HEAD | sort | tee /tmp/m11-files.txt
          cat > /tmp/m11-expected.txt <<'EOF'
          agent/provider_controls.go
          agent/provider_controls_test.go
          docs/current-status.md
          docs/milestone11.md
          EOF
          diff -u /tmp/m11-expected.txt /tmp/m11-files.txt

      - name: Run targeted M11 tests
        shell: bash
        run: |
          echo "===== TARGETED M11 TESTS ====="
          go test ./agent -count=1 -v -run '^(TestValidateProviderResourceControls|TestEvaluateProviderResourceRequest|TestProviderManualPauseBlocksNewWork|TestProviderAllowedHours|TestMaximumEarningsModeRespectsResourceLimits|TestProviderLocalUserReturnBehavior|TestEvaluateActiveProviderWork|TestProviderFiftyPercentSharing|TestProviderIncreaseToMaximumEarningsMode|TestMaximumEarningsStopsNewWorkWhenLocalUserReturns|TestManualPauseStopsNewWorkButPreservesActiveWork|TestProviderSharingCanBeReenabledAfterManualPause|TestProviderControlGoverningSequence)$'

      - name: Run full repository test suite
        shell: bash
        run: |
          echo "===== FULL REPOSITORY TEST SUITE ====="
          go test ./... -count=1

      - name: Verify clean runner worktree
        shell: bash
        run: |
          echo "===== FINAL WORKTREE ====="
          git status --short
          test -z "$(git status --porcelain)"
