name: MS-02 M13 Gate 17 Offline V8 to V10 Upgrade Fixture
on:
  push:
    branches: [infra/ms02-runner-gateway]
    paths: [.github/workflows/ms02-m13-gate17-offline-v8-to-v10.yml]
permissions:
  contents: read
concurrency:
  group: meshalot-m13-g17-offline-migration-fixture
  cancel-in-progress: false
jobs:
  isolated-migration:
    if: github.repository == 'wwjd4u/MeshAlot' && github.ref == 'refs/heads/infra/ms02-runner-gateway'
    runs-on: [self-hosted, Linux, X64, meshalot, ms02]
    timeout-minutes: 12
    steps:
      - name: Check out pinned and previously tested M13 source
        uses: actions/checkout@v4
        with:
          ref: 4f67ee54e5ebca084e38e306e723ae0acd08e77d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production-matched migration path using disposable synthetic database
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = "meshalot-ms02"
          test "$(hostname -s)" = "wwjd4u-MS-02-Ultra"
          test "$(id -un)" = "jason_guynes"
          test "$HOME" = "/home/jason_guynes"
          test "$(git rev-parse HEAD)" = "4f67ee54e5ebca084e38e306e723ae0acd08e77d"
          test "$(git rev-parse refs/remotes/origin/main)" = "1016c9b058690f34058dfab9cde7927e421fa469"
          test -z "$(git status --porcelain)"
          echo "M13_G17_V8_TO_V10_PINNED_SOURCE=PASS"

          docker info >/dev/null
          docker image inspect postgres:16-alpine >/dev/null
          WORK="$(mktemp -d "$RUNNER_TEMP/m13-g17-v8-to-v10.XXXXXXXX")"
          CID=""
          cleanup() {
            if test -n "$CID"; then
              docker rm -f -v "$CID" >/dev/null 2>&1 || true
            fi
            if test -n "$WORK" && test -d "$WORK"; then
              rm -rf -- "$WORK"
            fi
          }
          trap cleanup EXIT
          mkdir -m 700 -p "$WORK/stage/migrations" "$WORK/tools"
          cp database/migrate.py "$WORK/stage/migrate.py"
          for f in database/migrations/*.up.sql; do
            case "$(basename "$f")" in
              000009_*|000010_*) ;;
              *) cp -- "$f" "$WORK/stage/migrations/" ;;
            esac
          done

          CID="$(docker run -d --rm --pull=never --network=none \
            --read-only --user=70:70 --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=128 \
            --memory=2g --memory-swap=2g --cpus=2 \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=1g,uid=70,gid=70,mode=0700 \
            --tmpfs /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m,uid=70,gid=70,mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,uid=70,gid=70,mode=1777 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:16-alpine -c listen_addresses=)"
          test -n "$CID"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$CID")" = "none"

          ready=0
          for i in $(seq 1 24); do
            if docker exec "$CID" pg_isready -h /var/run/postgresql -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1 || { echo "M13_G17_ISOLATED_POSTGRES=FAILED_SAFE_STOP"; exit 1; }
          echo "M13_G17_POSTGRES16_NETWORK_ISOLATION=PASS"
          docker exec -e PGHOST=/var/run/postgresql "$CID" createdb -U postgres meshalot_m13test

          cat > "$WORK/tools/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec -i -e PGHOST=/var/run/postgresql "$M13_G17_DB_CONTAINER" psql -U postgres "$@"
          SH
          chmod 0700 "$WORK/tools/psql"
          export M13_G17_DB_CONTAINER="$CID"
          export PATH="$WORK/tools:$PATH"
          unset PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE PGSERVICE || true

          migrate() {
            local label="$1"
            shift
            if python3 "$WORK/stage/migrate.py" "$@" >"$WORK/migrate.log" 2>&1; then
              echo "$label=PASS"
            else
              echo "$label=FAILED_SAFE_STOP"
              exit 1
            fi
          }

          check_sql() {
            docker exec -e PGHOST=/var/run/postgresql "$CID" \
              psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d meshalot_m13test -c "$1"
          }

          migrate M13_G17_TRACKED_V8_CREATED apply --database meshalot_m13test
          test "$(check_sql 'SELECT count(*)=8 AND min(version)=1 AND max(version)=8 FROM meshalot_meta.schema_migrations')" = t
          echo "M13_G17_PRODUCTION_MATCHING_SCHEMA_V8=PASS"

          docker exec -i -e PGHOST=/var/run/postgresql "$CID" \
            psql -X -q -v ON_ERROR_STOP=1 -U postgres -d meshalot_m13test \
            >"$WORK/fixture.log" 2>&1 <<'SQL'
          INSERT INTO users(email) VALUES ('m13-g17-upgrade-fixture@example.invalid');
          INSERT INTO nodes(user_id,node_key,agent_version,identity_public_key)
            SELECT id,'m13-g17-fake-node','M12','m13-g17-not-a-real-key'
            FROM users WHERE email='m13-g17-upgrade-fixture@example.invalid';
          INSERT INTO node_status(node_id,status,mode,observed_at,last_heartbeat)
            SELECT id,'online','available','2026-10-07 18:00:00+00','2026-10-07 18:00:00+00'
            FROM nodes WHERE node_key='m13-g17-fake-node';
          INSERT INTO network_benchmarks(node_id,payload,score,observed_at)
            SELECT id,'{"marker":"preserve-m13-fixture"}'::jsonb,67,'2026-10-07 18:00:00+00'
            FROM nodes WHERE node_key='m13-g17-fake-node';
          SQL
          echo "M13_G17_V8_SYNTHETIC_HISTORY=PASS"

          cp database/migrations/000009_node_rating_m10.up.sql "$WORK/stage/migrations/"
          cp database/migrations/000010_m13_heartbeat.up.sql "$WORK/stage/migrations/"
          migrate M13_G17_TRACKED_V8_TO_V10_APPLY apply --database meshalot_m13test
          migrate M13_G17_TRACKED_V10_STATUS status --database meshalot_m13test
          migrate M13_G17_TRACKED_V10_IDEMPOTENT apply --database meshalot_m13test

          test "$(check_sql 'SELECT count(*)=10 AND min(version)=1 AND max(version)=10 AND count(DISTINCT version)=10 FROM meshalot_meta.schema_migrations')" = t
          test "$(check_sql 'SELECT to_regclass('"'public.node_ratings'"') IS NOT NULL')" = t
          test "$(check_sql "SELECT EXISTS(SELECT 1 FROM nodes n JOIN node_status s ON s.node_id=n.id WHERE n.node_key='m13-g17-fake-node' AND s.status='online' AND s.mode='available' AND s.last_heartbeat='2026-10-07 18:00:00+00'::timestamptz AND s.m13_telemetry IS NULL)")" = t
          test "$(check_sql "SELECT EXISTS(SELECT 1 FROM network_benchmarks b JOIN nodes n ON n.id=b.node_id WHERE n.node_key='m13-g17-fake-node' AND b.score=67 AND b.payload->>'marker'='preserve-m13-fixture')")" = t
          echo "M13_G17_V8_TO_V10_HISTORY_PRESERVED=PASS"

          test -z "$(git status --porcelain)"
          echo "M13_G17_WORKTREE_PRESERVED=PASS"
          echo "M13_G17_OFFLINE_V8_TO_V10_VALIDATION=PASS"
