name: MS-02 M13 Gate 9 Reconnect
on:
  push:
    branches:
      - infra/ms02-runner-gateway
    paths:
      - .github/workflows/ms02-m13-gate9.yml
permissions:
  contents: write
jobs:
  reconnect:
    if: github.repository == 'wwjd4u/MeshAlot'
    runs-on: [self-hosted, Linux, X64, meshalot, ms02]
    timeout-minutes: 12
    steps:
      - name: Checkout isolated M13 branch
        uses: actions/checkout@v4
        with:
          ref: m13-persistent-heartbeat
          fetch-depth: 0
          persist-credentials: true
      - name: Format, test TLS interruption, and verify automatic reauthentication
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "meshalot-ms02"
          test "$(git rev-parse HEAD)" = "0645e28818f0fad3c25fafd3ef3300fae9c29b7e"
          echo "M13_GATE9_INPUT=$(git rev-parse HEAD)"
          gofmt -w agent/m13_reconnect.go agent/m13_reconnect_test.go agent/cmd/meshalot-agent/connect.go
          git diff --check
          go mod verify
          go test ./agent -run '^TestM13Reconnect|^TestM13Persistent' -v -count=1
          go test ./agent/cmd/meshalot-agent -run '^TestM13Connect' -v -count=1
          go test ./... -count=1
          go test -race ./agent -run '^TestM13Reconnect|^TestM13Persistent' -count=1
          go vet ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/m13-gate9-darwin-amd64.test" ./agent
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/m13-gate9-darwin-arm64.test" ./agent
          test -s "$RUNNER_TEMP/m13-gate9-darwin-amd64.test"
          test -s "$RUNNER_TEMP/m13-gate9-darwin-arm64.test"
          echo "M13_GATE9_TESTS=PASS"
          if ! git diff --quiet -- agent/m13_reconnect.go agent/m13_reconnect_test.go agent/cmd/meshalot-agent/connect.go; then
            git config user.name "meshalot-ms02-runner"
            git config user.email "meshalot-runner@users.noreply.github.com"
            git add -- agent/m13_reconnect.go agent/m13_reconnect_test.go agent/cmd/meshalot-agent/connect.go
            git diff --cached --check
            git commit -m "M13 Gate 9: format persistent outbound reconnect and tests"
            git push origin HEAD:refs/heads/m13-persistent-heartbeat
          fi
          echo "M13_GATE9_VALIDATED_COMMIT=$(git rev-parse HEAD)"
          test -z "$(gofmt -l agent/m13_reconnect.go agent/m13_reconnect_test.go agent/cmd/meshalot-agent/connect.go)"
          echo "M13_GATE9=PASS"
