name: MS-02 M13 Gate 8 Isolated Database
on:
  push:
    branches:
      - infra/ms02-runner-gateway
    paths:
      - .github/workflows/ms02-m13-gate8-db.yml
permissions:
  contents: write
jobs:
  stale-postgres:
    if: github.repository == 'wwjd4u/MeshAlot'
    runs-on: [self-hosted, Linux, X64, meshalot, ms02]
    timeout-minutes: 12
    steps:
      - name: Checkout exact M13 commit for isolated tests
        uses: actions/checkout@v4
        with:
          ref: m13-persistent-heartbeat
          fetch-depth: 0
          persist-credentials: true
      - name: Test stale status, dashboard, account scoping and recovery with disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "meshalot-ms02"
          test "$(git rev-parse HEAD)" = "f201ae0b527fef1d8e56699997ee52761649d7c9"
          echo "M13_GATE8_DB_INPUT=$(git rev-parse HEAD)"
          gofmt -w server/m13_stale_postgres_test.go
          git diff --check
          go mod verify
          TEMP_BASE="$(mktemp -d "$RUNNER_TEMP/m13-stale-db.XXXXXX")"
          CID=""
          cleanup() {
            if test -n "$CID"; then
              docker exec -u root "$CID" chmod 0777 /var/run/postgresql >/dev/null 2>&1 || true
              docker rm -f -v "$CID" >/dev/null 2>&1 || true
            fi
            rm -rf "$TEMP_BASE" || true
          }
          trap cleanup EXIT
          # Clean only the temp socket files left by the earlier, failed
          # M13 Gate 8 run. Do not touch other runner or project files.
          PREVIOUS_M13_TEMP="$RUNNER_TEMP/m13-stale-db.u4aZ6G"
          if test -d "$PREVIOUS_M13_TEMP/socket"; then
            docker run --rm --network none --pull=missing \
              -v "$PREVIOUS_M13_TEMP/socket:/old-socket" \
              postgres:16-alpine sh -c \
              'rm -f /old-socket/.s.PGSQL.5432 /old-socket/.s.PGSQL.5432.lock'
            rm -rf "$PREVIOUS_M13_TEMP"
            echo "M13_PRIOR_TEMP_SOCKET_CLEANUP=PASS"
          fi
          mkdir -p "$TEMP_BASE/socket"
          chmod 0777 "$TEMP_BASE/socket"
          docker info >/dev/null
          CID="$(docker run -d --rm --network none --pull=missing \
             -e POSTGRES_HOST_AUTH_METHOD=trust \
             -v "$TEMP_BASE/socket:/var/run/postgresql" \
             -v "$PWD:/repo:ro" \
             postgres:16-alpine)"
          for i in $(seq 1 12); do
            if docker exec "$CID" pg_isready -h /var/run/postgresql -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! docker exec "$CID" pg_isready -h /var/run/postgresql -U postgres; then
            docker logs "$CID" || true
            exit 1
          fi
          docker exec -e PGHOST=/var/run/postgresql "$CID" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'CREATE ROLE meshalot LOGIN;'
          docker exec -e PGHOST=/var/run/postgresql "$CID" createdb -U postgres meshalot_m13test
          docker exec -e PGHOST=/var/run/postgresql "$CID" sh -c 'for f in /repo/database/migrations/*.up.sql; do
            echo "APPLY=$(basename "$f")"
            psql -v ON_ERROR_STOP=1 -U postgres -d meshalot_m13test -f "$f" >/dev/null || exit 1
          done'
          docker exec -e PGHOST=/var/run/postgresql "$CID" psql -v ON_ERROR_STOP=1 -U postgres -d meshalot_m13test -f /repo/database/runtime-grants.sql >/dev/null
          docker exec -e PGHOST=/var/run/postgresql "$CID" psql -v ON_ERROR_STOP=1 -U postgres -d meshalot_m13test -f /repo/database/tests/milestone13_runtime_privileges.sql
          MESHALOT_M13_STALE_TEST_DSN="host=$TEMP_BASE/socket port=5432 user=postgres dbname=meshalot_m13test sslmode=disable" \
            go test ./server -run '^TestM13StalePostgresIntegration$' -v -count=1
          echo "M13_GATE8_DB_RUNTIME=PASS"
          if ! git diff --quiet -- server/m13_stale_postgres_test.go; then
            git config user.name "meshalot-ms02-runner"
            git config user.email "meshalot-runner@users.noreply.github.com"
            git add -- server/m13_stale_postgres_test.go
            git diff --cached --check
            git commit -m "M13 Gate 8: format real PostgreSQL stale-node regression test"
            git push origin HEAD:refs/heads/m13-persistent-heartbeat
          fi
          echo "M13_GATE8_DB_VALIDATED=$(git rev-parse HEAD)"
          echo "M13_GATE8_ISOLATED_DATABASE=PASS"
