name: MS-02 M13 Gate17 Encrypted Rollback Copy Read-only Verification
on:
  push:
    branches: [infra/ms02-runner-gateway]
    paths:
      - .github/workflows/ms02-m13-gate17-rollback-copy-verify-readonly.yml
permissions:
  contents: read
concurrency:
  group: meshalot-m13-local-recovery-verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'wwjd4u/MeshAlot' && github.ref == 'refs/heads/infra/ms02-runner-gateway'
    runs-on: [self-hosted, Linux, X64, meshalot, ms02]
    timeout-minutes: 4
    steps:
      - name: Revalidate local encrypted archive and evidence without reading recovery passphrase
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = "meshalot-ms02"
          test "$(hostname -s)" = "wwjd4u-MS-02-Ultra"
          test "$(id -un)" = "jason_guynes"
          test "$HOME" = "/home/jason_guynes"
          python3 - <<'PY'
          import hashlib,json,os,stat,sys
          from pathlib import Path
          
          def require(test):
              if not test: raise RuntimeError("safe-stop")
          def verified_file(path):
              s=path.lstat()
              require(stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid())
              require(stat.S_IMODE(s.st_mode)==0o600 and 0<s.st_size<1024**3)
              return s
          def verified_dir(path):
              s=path.lstat()
              require(stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid())
              require(stat.S_IMODE(s.st_mode)==0o700)
          
          try:
              home=Path("/home/jason_guynes")
              root=home/".local/share/meshalot-m13-private-rollbacks"
              keys=home/".local/share/meshalot-m13-backup-keys"
              verified_dir(root)
              verified_dir(keys)
              runs=[x for x in root.iterdir() if x.name.startswith("m13-g17-rollback-")]
              require(len(runs)==1)
              run=runs[0]
              verified_dir(run)
              archive=run/"known-good-api-systemd-caddy.tar.gpg"
              cs=run/"known-good-api-systemd-caddy.tar.gpg.sha256"
              evidence=run/"rollback-capture-evidence.json"
              key=keys/(run.name+".passphrase")
              verified_file(archive)
              verified_file(cs)
              verified_file(evidence)
              verified_file(key)
              digest=hashlib.sha256()
              with archive.open("rb") as stream:
                  for block in iter(lambda:stream.read(1024*1024),b""):
                      digest.update(block)
              require(cs.read_text(encoding="utf-8")==digest.hexdigest()+"  "+str(archive)+"\n")
              record=json.loads(evidence.read_text(encoding="utf-8"))
              require(record.get("archive_sha256")==digest.hexdigest())
              require(record.get("archive_size_bytes")==archive.stat().st_size)
              require(record.get("archive_members_verified")==9)
              require(record.get("environment_file_contents")=="EXCLUDED")
              require(record.get("database_data")=="EXCLUDED")
              require(record.get("production_changes")=="NONE")
              require(record.get("offmachine_recovery_copy")=="PENDING")
              require(record.get("full_rollback_rehearsal")=="PENDING")
              print("M13_G17_PRIVATE_ARCHIVE_SHA256=PASS")
              print("M13_G17_PRIVATE_RECOVERY_KEY_PERMISSIONS=PASS")
              print("M13_G17_CAPTURE_EVIDENCE_RECONFIRMED=PASS")
              print("M13_G17_OFFMACHINE_COPY=NOT_VERIFIED")
              print("M13_G17_NO_PRODUCTION_CONNECTION=PASS")
              print("M13_G17_LOCAL_ROLLBACK_COPY_READONLY_VERIFICATION=PASS")
          except Exception:
              print("M13_G17_LOCAL_ROLLBACK_COPY_READONLY_VERIFICATION=FAILED_SAFE_STOP")
              sys.exit(1)
          PY
