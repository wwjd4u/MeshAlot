services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: meshalot
      POSTGRES_USER: meshalot
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - meshalot-postgres:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  meshalot-postgres:
